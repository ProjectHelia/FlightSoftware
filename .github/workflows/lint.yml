name: Lint (clang-format)

# Auto-formats every C/C++ file with clang-format and commits the result
# straight back to the branch - no separate "fix this yourself" step.
# Runs on pushes to any branch and on PRs (so a PR from a branch in this
# repo gets fixed in place before merge). PRs from forks can't be pushed
# to with GITHUB_TOKEN, so those just get skipped silently by the commit
# step - not an error, just nothing to auto-push.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull_request events, check out the PR's head branch (not
          # the merge-commit ref actions/checkout uses by default) so the
          # auto-commit step below has something real to push to.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      # ubuntu-24.04's default clang-format drifts between runner images;
      # pin an exact version so formatting results don't change under you.
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Run clang-format
        run: |
          find src libs tests -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format -i -style=file {} +

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply clang-format"
          commit_user_name: "clang-format-bot"
          commit_user_email: "actions@github.com"
