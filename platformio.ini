; HELIA flight software - one environment per node.
;
;   pio run -e eps -t upload -t monitor
;
; Every env pins its upload/monitor port so firmware can't land on the wrong
; board. macOS names ports by USB socket position, so after moving cables run
; `pio device list` and match each board by its SER= value.

[platformio]
default_envs = eps

[env]
platform = espressif32@6.9.0     ; ships ESP-IDF 5.3.1
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
monitor_speed = 115200

[env:master]
board_build.cmake_extra_args = -DHELIA_NODE=Master
board_upload.flash_size = 2MB
board_build.flash_size = 2MB
upload_port  = /dev/cu.usbmodem101   ; TODO: confirm with `pio device list`
monitor_port = /dev/cu.usbmodem101

[env:eps]
board_build.cmake_extra_args = -DHELIA_NODE=EPS
upload_port  = /dev/cu.usbmodem1301   ; the board you verified as EPS
monitor_port = /dev/cu.usbmodem1301

[env:instrumentation]
board_build.cmake_extra_args = -DHELIA_NODE=Instrumentation
upload_port  = /dev/cu.usbmodem1201 
monitor_port = /dev/cu.usbmodem1201

; [env:mechanisms]
; board_build.cmake_extra_args = -DHELIA_NODE=Mechanisms
; [env:thermals]
; board_build.cmake_extra_args = -DHELIA_NODE=Thermals

[env:photonics]
board_build.cmake_extra_args = -DHELIA_NODE=Photonics
upload_port  = /dev/cu.usbmodem21401
monitor_port = /dev/cu.usbmodem21401