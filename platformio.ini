[env:eps]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -D NODE_ID=0x6
    -D TWAI_TX_GPIO=1
    -D TWAI_RX_GPIO=2
upload_port = /dev/cu.usbmodem1301

